# Novela das Frutas - infraestrutura local
# Fase 1: apenas o n8n.
# Fase 3: o servico "editor" (Python + FFmpeg) entra aqui tambem.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n
      # pasta compartilhada onde os episodios gerados serao salvos
      - ./output:/home/node/output

  # editor:            # <- Fase 3 (montagem do video com FFmpeg)
  #   build: ./editor
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ./output:/app/output

volumes:
  n8n_data:
